name: release-build

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_ZIP_NAME: msfs-pushback-helper-app-${{ github.ref_name }}.zip

    steps:
    - name: Checkout source
      uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Restore packages
      run: msbuild PushbackHelper.sln -t:restore -p:RestorePackagesConfig=true
    - name: Build
      run: msbuild PushbackHelper.sln /p:Configuration=Release /p:Platform=x64
    - name: Create ZIP file
      shell: bash
      run: |
        7z a -tzip "./${{ env.RELEASE_ZIP_NAME }}" "./PushbackHelper/bin/Release/*"
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: ./${{ env.RELEASE_ZIP_NAME }}
